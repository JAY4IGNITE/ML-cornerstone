# Local demo stack: a single Streamlit service that trains on synthetic data at
# first run and serves the app (the model is imported directly, no API). NOT a
# production deployment — no TLS, no auth, no persistence. See docs/RESPONSIBLE_USE.md.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Point at a config override or flip dataset.source via a mounted config.
      LOAN_RISK_CONFIG: /app/config/config.yaml
    volumes:
      # Persist trained artifacts + generated data between runs (optional).
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s   # allow first-run training to finish
