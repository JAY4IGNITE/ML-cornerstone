[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-risk"
version = "0.1.0"
description = "Intelligent Loan Risk Assessment System — Home Credit Default Risk (default-risk prediction, not approval)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ML Cornerstone" }]

# This table lists the core runtime deps as compatible version ranges (>=, with
# upper bounds where needed) so an editable `pip install -e .` works standalone.
# These are ranges, not pinned/locked versions, so they do not by themselves
# guarantee byte-for-byte reproducible installs. The requirements*.txt files hold
# the fuller install set: requirements.txt (core runtime/ML/API) and
# requirements-extras.txt (optional xgboost/shap accelerators).
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=15.0",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4",
    "PyYAML>=6.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
extras = ["xgboost>=2.1", "shap>=0.46"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
loan-risk-synth = "loan_risk.data.synthetic:main"
loan-risk-download = "loan_risk.data.download:main"
loan-risk-train = "loan_risk.pipeline.run:main"

[tool.setuptools.packages.find]
include = ["loan_risk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: pyupgrade, B: bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
