# =====================================================================
# Central configuration. Nothing that varies (paths, thresholds, seeds,
# hyperparameters) is hardcoded in source — Execution Rule #7.
# Override any value via env var LOAN_RISK_CONFIG pointing at another file.
# =====================================================================

project:
  name: "Intelligent Loan Risk Assessment System"
  task: "default_risk"          # NOT loan approval — see 01_PROJECT_CONTEXT.md
  random_seed: 42

paths:
  data_raw: "data/raw"          # real Kaggle files land here (git-ignored)
  data_synthetic: "data/synthetic"
  data_processed: "data/processed"
  artifacts: "artifacts"        # trained pipeline + metadata + schema
  reports: "reports"            # validation report, metrics, plots
  manifest: "data/manifest.json"

dataset:
  # Which source to train on. "synthetic" is the labeled stress-test fixture;
  # "real" expects application_train.csv in paths.data_raw (from Kaggle).
  source: "real"
  primary_file: "application_train.csv"
  synthetic_file: "application_train_synthetic.csv"
  target: "TARGET"
  id_column: "SK_ID_CURR"

synthetic:
  n_rows: 20000
  positive_rate: 0.081          # matches documented Home Credit ~8.1% default rate
  missing_rate_ext_source: 0.35 # EXT_SOURCE_1/3 are heavily missing in reality
  missing_rate_occupation: 0.31

split:
  test_size: 0.20
  val_size: 0.20                # fraction OF the train-remainder
  stratify: true

preprocessing:
  numeric_imputation: "median"
  categorical_unknown_token: "__UNKNOWN__"
  scale_for_linear: true
  # DAYS_EMPLOYED sentinel for pensioners/unemployed -> treated as missing.
  days_employed_anomaly: 365243

models:
  logistic_regression:
    enabled: true
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
  decision_tree:
    enabled: true
    max_depth: 6
    min_samples_leaf: 50
    class_weight: "balanced"
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 20
    n_jobs: -1
    class_weight: "balanced"
  xgboost:
    enabled: true                # auto-skipped if xgboost not installed
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

calibration:
  method: "isotonic"            # isotonic | sigmoid
  cv: 3

evaluation:
  # Model selected by this metric (NOT accuracy alone — 03_ML_REQUIREMENTS.md).
  selection_metric: "roc_auc"

selection:
  # Model selection uses stratified k-fold cross-validation on TRAIN+VAL and
  # picks the best MEAN score (std reported), instead of a single-split argmax,
  # so selection is not one lucky split. Set to 1 to fall back to the single
  # held-out validation split.
  cv_folds: 5

tuning:
  # Opt-in hyperparameter search (RandomizedSearchCV) for the heavier models.
  # Runs on a stratified subsample for tractability; the winning params are
  # refit on the full training data. Disable for a fast, fixed-config run.
  enabled: true
  models: ["random_forest", "xgboost"]
  n_iter: 8
  cv_folds: 3
  max_search_samples: 40000
  # Distributions are sampled uniformly (lists). Keys are pipeline-scoped
  # (model__<param>) so they target the estimator inside the Pipeline.
  param_distributions:
    random_forest:
      model__n_estimators: [200, 300, 400]
      model__max_depth: [8, 12, 16, 20]
      model__min_samples_leaf: [10, 20, 50]
    xgboost:
      model__n_estimators: [300, 400, 600]
      model__max_depth: [4, 5, 6, 8]
      model__learning_rate: [0.03, 0.05, 0.1]
      model__subsample: [0.7, 0.8, 1.0]
      model__colsample_bytree: [0.7, 0.8, 1.0]

risk_score:
  # Transparent, explicitly-defined mapping from probability -> 0..100 score.
  # score = round(default_probability * 100). Bands are on probability.
  bands:
    - { name: "Low",       min_prob: 0.00, max_prob: 0.08 }
    - { name: "Moderate",  min_prob: 0.08, max_prob: 0.20 }
    - { name: "Elevated",  min_prob: 0.20, max_prob: 0.40 }
    - { name: "High",      min_prob: 0.40, max_prob: 1.01 }

explainability:
  top_k_features: 12

api:
  title: "Loan Default Risk API"
  version: "0.1.0"
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
